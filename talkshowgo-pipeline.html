<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkShowGo — Pipeline Explorer</title>
<style>
  :root {
    --bg: oklch(0.14 0.015 260);
    --surface: oklch(0.19 0.02 260);
    --surface2: oklch(0.23 0.025 260);
    --border: oklch(0.32 0.03 260);
    --text: oklch(0.92 0.01 260);
    --muted: oklch(0.62 0.04 260);
    --accent: oklch(0.65 0.22 290);
    --accent2: oklch(0.55 0.18 290);
    --green: oklch(0.65 0.18 155);
    --blue: oklch(0.62 0.18 250);
    --orange: oklch(0.7 0.18 60);
    --red: oklch(0.65 0.18 25);
    --yellow: oklch(0.78 0.15 85);
    --pink: oklch(0.65 0.18 340);
    --radius: 0.625rem;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* ---- HEADER ---- */
  .header {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
  }
  .header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.025em;
  }
  .header .tag {
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    background: var(--accent2);
    color: white;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---- LAYOUT ---- */
  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 56px);
  }

  /* ---- SIDEBAR ---- */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 1rem;
  }
  .sidebar h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 0.75rem;
    font-weight: 600;
  }
  .control-group {
    margin-bottom: 1.25rem;
  }
  .control-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    margin-bottom: 0.35rem;
    color: var(--text);
  }
  .control-group input[type="text"],
  .control-group textarea,
  .control-group select {
    width: 100%;
    padding: 0.5rem 0.65rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.8rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .control-group input:focus,
  .control-group textarea:focus,
  .control-group select:focus {
    border-color: var(--accent);
  }
  .control-group textarea { resize: vertical; min-height: 60px; }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0;
  }
  .toggle-row input[type="checkbox"] {
    accent-color: oklch(0.6 0.2 290);
    width: 15px;
    height: 15px;
  }
  .toggle-row span {
    font-size: 0.8rem;
  }

  .preset-row {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .preset-btn {
    padding: 0.3rem 0.6rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.72rem;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.2s;
  }
  .preset-btn:hover { border-color: var(--accent); background: oklch(0.25 0.03 290); }
  .preset-btn.active { border-color: var(--accent); background: oklch(0.28 0.06 290); color: white; }

  /* ---- MAIN ---- */
  .main {
    overflow-y: auto;
    padding: 1.5rem 2rem;
  }

  /* ---- PIPELINE STEPS ---- */
  .pipeline {
    max-width: 780px;
  }

  .step {
    position: relative;
    margin-bottom: 0.25rem;
  }

  .step-connector {
    position: absolute;
    left: 20px;
    top: 48px;
    bottom: -8px;
    width: 2px;
    background: var(--border);
  }
  .step:last-child .step-connector { display: none; }

  .step-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    cursor: pointer;
    padding: 0.6rem 0.75rem;
    border-radius: var(--radius);
    transition: background 0.15s;
  }
  .step-header:hover { background: var(--surface); }

  .step-number {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    flex-shrink: 0;
    border: 2px solid;
    position: relative;
    z-index: 1;
  }

  .step-info { flex: 1; min-width: 0; }
  .step-title {
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .step-subtitle {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.1rem;
  }
  .step-file {
    font-size: 0.65rem;
    color: var(--muted);
    font-family: var(--mono);
    opacity: 0.7;
  }

  .step-badge {
    font-size: 0.6rem;
    padding: 0.15rem 0.45rem;
    border-radius: 999px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .step-detail {
    margin-left: 56px;
    margin-bottom: 1.25rem;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.25s ease;
  }
  .step-detail.collapsed { max-height: 0 !important; opacity: 0; margin-bottom: 0; }

  .detail-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    margin-top: 0.5rem;
  }

  .detail-section {
    margin-bottom: 0.85rem;
  }
  .detail-section:last-child { margin-bottom: 0; }
  .detail-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 0.35rem;
  }

  .io-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px);
    padding: 0.6rem 0.75rem;
    font-family: var(--mono);
    font-size: 0.72rem;
    line-height: 1.65;
    color: oklch(0.8 0.02 260);
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .io-block .key { color: var(--blue); }
  .io-block .str { color: var(--green); }
  .io-block .num { color: var(--orange); }
  .io-block .comment { color: var(--muted); font-style: italic; }
  .io-block .bool { color: var(--pink); }
  .io-block .highlight { color: var(--yellow); font-weight: 600; }

  .data-flow {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.5rem 0;
    font-size: 0.75rem;
  }
  .data-tag {
    padding: 0.2rem 0.5rem;
    border-radius: var(--radius);
    font-size: 0.68rem;
    font-weight: 600;
    border: 1px solid;
  }
  .data-tag.input { color: var(--blue); border-color: oklch(0.4 0.1 250); background: oklch(0.2 0.04 250); }
  .data-tag.output { color: var(--green); border-color: oklch(0.4 0.1 155); background: oklch(0.2 0.04 155); }
  .data-tag.optional { color: var(--orange); border-color: oklch(0.4 0.1 60); background: oklch(0.2 0.04 60); }
  .data-tag.service { color: var(--pink); border-color: oklch(0.4 0.1 340); background: oklch(0.2 0.04 340); }

  .arrow { color: var(--muted); font-size: 0.85rem; }

  /* ---- PROMPT OUTPUT ---- */
  .prompt-section {
    margin-top: 2rem;
    max-width: 780px;
  }
  .prompt-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.5rem;
  }
  .prompt-header h2 {
    font-size: 0.85rem;
    font-weight: 600;
  }
  .copy-btn {
    padding: 0.35rem 0.75rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.75rem;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.2s;
  }
  .copy-btn:hover { border-color: var(--accent); background: oklch(0.28 0.04 290); }
  .copy-btn.copied { background: oklch(0.3 0.08 155); border-color: var(--green); color: var(--green); }

  .prompt-output {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    font-size: 0.8rem;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
  }

  /* disabled step styling */
  .step.disabled .step-header { opacity: 0.4; }
  .step.disabled .step-connector { opacity: 0.3; }

  /* color coding for step types */
  .step-type-entry .step-number { border-color: var(--accent); color: var(--accent); background: oklch(0.2 0.05 290); }
  .step-type-research .step-number { border-color: var(--blue); color: var(--blue); background: oklch(0.2 0.05 250); }
  .step-type-enrichment .step-number { border-color: var(--green); color: var(--green); background: oklch(0.2 0.04 155); }
  .step-type-llm .step-number { border-color: var(--orange); color: var(--orange); background: oklch(0.2 0.05 60); }
  .step-type-audio .step-number { border-color: var(--pink); color: var(--pink); background: oklch(0.2 0.05 340); }
  .step-type-output .step-number { border-color: var(--yellow); color: var(--yellow); background: oklch(0.2 0.05 85); }

  .legend {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 1rem 0;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <h1>TalkShowGo Pipeline Explorer</h1>
  <span class="tag">Interactive</span>
</div>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Presets</h2>
    <div class="preset-row">
      <button class="preset-btn active" onclick="applyPreset('battlerap')">Battle Rap</button>
      <button class="preset-btn" onclick="applyPreset('nba')">NBA Drama</button>
      <button class="preset-btn" onclick="applyPreset('legal')">Legal Story</button>
      <button class="preset-btn" onclick="applyPreset('minimal')">Quick Take</button>
    </div>

    <h2>Query</h2>
    <div class="control-group">
      <label>Research Query</label>
      <textarea id="query" rows="3" oninput="updateAll()">Cassidy vs Hitman Holla battle recap and community reaction</textarea>
    </div>
    <div class="control-group">
      <label>Topic ID</label>
      <input type="text" id="topicId" value="864dbcf4-e1f7-4b1a-86ed-c18007439ad5" oninput="updateAll()">
    </div>

    <div class="divider"></div>
    <h2>Research Config</h2>
    <div class="control-group">
      <label>Research Mode</label>
      <select id="researchMode" onchange="updateAll()">
        <option value="youtube_first">YouTube First (default)</option>
        <option value="twitter_first">Twitter First</option>
      </select>
    </div>
    <div class="control-group">
      <label>Max Videos</label>
      <select id="maxVideos" onchange="updateAll()">
        <option value="5">5 (fast)</option>
        <option value="10" selected>10 (balanced)</option>
        <option value="20">20 (thorough)</option>
      </select>
    </div>

    <div class="divider"></div>
    <h2>Optional Steps</h2>
    <div class="toggle-row">
      <input type="checkbox" id="enableInterviews" checked onchange="updateAll()">
      <span>Interview Lookup</span>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="enableEnrichment" checked onchange="updateAll()">
      <span>Entity Enrichment</span>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="enableTwitter" onchange="updateAll()">
      <span>Twitter Sentiment</span>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="enableDocSearch" onchange="updateAll()">
      <span>Document Search</span>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="enablePackage" onchange="updateAll()">
      <span>Research Package</span>
    </div>

    <div class="divider"></div>
    <h2>Story Config</h2>
    <div class="control-group">
      <label>Style</label>
      <select id="storyStyle" onchange="updateAll()">
        <option value="documentary" selected>Documentary</option>
        <option value="news">News Bulletin</option>
        <option value="analysis">Analysis</option>
        <option value="narrative">Narrative</option>
      </select>
    </div>
    <div class="control-group">
      <label>Tone</label>
      <select id="storyTone" onchange="updateAll()">
        <option value="engaging" selected>Engaging</option>
        <option value="serious">Serious</option>
        <option value="dramatic">Dramatic</option>
        <option value="neutral">Neutral</option>
      </select>
    </div>
    <div class="control-group">
      <label>Length</label>
      <select id="storyLength" onchange="updateAll()">
        <option value="short">Short (~500 words)</option>
        <option value="medium" selected>Medium (~1000 words)</option>
        <option value="long">Long (~2000 words)</option>
      </select>
    </div>

    <div class="divider"></div>
    <h2>Audio</h2>
    <div class="toggle-row">
      <input type="checkbox" id="enableAudio" onchange="updateAll()">
      <span>Generate Dia Audio</span>
    </div>
    <div class="control-group">
      <label>Seed (voice consistency)</label>
      <input type="text" id="diaSeed" value="42" oninput="updateAll()">
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="border-color: var(--accent);"></div> Entry</div>
      <div class="legend-item"><div class="legend-dot" style="border-color: var(--blue);"></div> Research</div>
      <div class="legend-item"><div class="legend-dot" style="border-color: var(--green);"></div> Enrichment</div>
      <div class="legend-item"><div class="legend-dot" style="border-color: var(--orange);"></div> LLM</div>
      <div class="legend-item"><div class="legend-dot" style="border-color: var(--pink);"></div> Audio</div>
      <div class="legend-item"><div class="legend-dot" style="border-color: var(--yellow);"></div> Output</div>
    </div>

    <div class="pipeline" id="pipeline"></div>

    <div class="prompt-section">
      <div class="prompt-header">
        <h2>Generated API Request</h2>
        <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
      </div>
      <div class="prompt-output" id="promptOutput"></div>
    </div>
  </div>
</div>

<script>
// ---- STATE ----
const state = {
  query: '',
  topicId: '',
  researchMode: 'youtube_first',
  maxVideos: 10,
  enableInterviews: true,
  enableEnrichment: true,
  enableTwitter: false,
  enableDocSearch: false,
  enablePackage: false,
  storyStyle: 'documentary',
  storyTone: 'engaging',
  storyLength: 'medium',
  enableAudio: false,
  diaSeed: 42,
  expandedSteps: new Set([0, 1])
};

// ---- PRESETS ----
const presets = {
  battlerap: {
    query: 'Cassidy vs Hitman Holla battle recap and community reaction',
    topicId: '864dbcf4-e1f7-4b1a-86ed-c18007439ad5',
    researchMode: 'youtube_first',
    maxVideos: '10',
    enableInterviews: true,
    enableEnrichment: true,
    enableTwitter: false,
    enableDocSearch: false,
    enablePackage: false,
    storyStyle: 'documentary',
    storyTone: 'engaging',
    storyLength: 'medium',
    enableAudio: false
  },
  nba: {
    query: 'NBA trade deadline biggest moves and team reactions',
    topicId: '',
    researchMode: 'twitter_first',
    maxVideos: '10',
    enableInterviews: true,
    enableEnrichment: true,
    enableTwitter: true,
    enableDocSearch: false,
    enablePackage: false,
    storyStyle: 'news',
    storyTone: 'engaging',
    storyLength: 'medium',
    enableAudio: false
  },
  legal: {
    query: 'Bad Newz snitching allegations paperwork and court records',
    topicId: '864dbcf4-e1f7-4b1a-86ed-c18007439ad5',
    researchMode: 'youtube_first',
    maxVideos: '20',
    enableInterviews: true,
    enableEnrichment: true,
    enableTwitter: true,
    enableDocSearch: true,
    enablePackage: true,
    storyStyle: 'documentary',
    storyTone: 'serious',
    storyLength: 'long',
    enableAudio: false
  },
  minimal: {
    query: 'Quick recap of last weekend battle rap events',
    topicId: '864dbcf4-e1f7-4b1a-86ed-c18007439ad5',
    researchMode: 'youtube_first',
    maxVideos: '5',
    enableInterviews: false,
    enableEnrichment: false,
    enableTwitter: false,
    enableDocSearch: false,
    enablePackage: false,
    storyStyle: 'news',
    storyTone: 'neutral',
    storyLength: 'short',
    enableAudio: false
  }
};

function applyPreset(name) {
  const p = presets[name];
  document.getElementById('query').value = p.query;
  document.getElementById('topicId').value = p.topicId;
  document.getElementById('researchMode').value = p.researchMode;
  document.getElementById('maxVideos').value = p.maxVideos;
  document.getElementById('enableInterviews').checked = p.enableInterviews;
  document.getElementById('enableEnrichment').checked = p.enableEnrichment;
  document.getElementById('enableTwitter').checked = p.enableTwitter;
  document.getElementById('enableDocSearch').checked = p.enableDocSearch;
  document.getElementById('enablePackage').checked = p.enablePackage;
  document.getElementById('storyStyle').value = p.storyStyle;
  document.getElementById('storyTone').value = p.storyTone;
  document.getElementById('storyLength').value = p.storyLength;
  document.getElementById('enableAudio').checked = p.enableAudio;

  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  updateAll();
}

// ---- READ STATE ----
function readState() {
  state.query = document.getElementById('query').value;
  state.topicId = document.getElementById('topicId').value;
  state.researchMode = document.getElementById('researchMode').value;
  state.maxVideos = parseInt(document.getElementById('maxVideos').value);
  state.enableInterviews = document.getElementById('enableInterviews').checked;
  state.enableEnrichment = document.getElementById('enableEnrichment').checked;
  state.enableTwitter = document.getElementById('enableTwitter').checked;
  state.enableDocSearch = document.getElementById('enableDocSearch').checked;
  state.enablePackage = document.getElementById('enablePackage').checked;
  state.storyStyle = document.getElementById('storyStyle').value;
  state.storyTone = document.getElementById('storyTone').value;
  state.storyLength = document.getElementById('storyLength').value;
  state.enableAudio = document.getElementById('enableAudio').checked;
  state.diaSeed = parseInt(document.getElementById('diaSeed').value) || 42;
}

// ---- BUILD STEPS ----
function getSteps() {
  const isLegal = /snitch|court|paper|allega|arrest|indic/i.test(state.query);
  const isTwitterFirst = state.researchMode === 'twitter_first';

  const steps = [
    {
      num: 0,
      type: 'entry',
      title: 'API Entry Point',
      subtitle: 'POST /api/stories/pipeline',
      file: 'src/app/api/stories/pipeline/route.ts',
      badge: { text: 'ENTRY', color: 'var(--accent)' },
      enabled: true,
      detail: () => `<div class="detail-section">
        <div class="detail-label">What happens</div>
        <div>Validates the request body, ensures required fields (<code>query</code> or <code>topic_id</code>), then delegates to <code>runStoryPipeline()</code>.</div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Request Body</div>
        <div class="io-block"><span class="key">query</span>: <span class="str">"${esc(state.query)}"</span>
${state.topicId ? `<span class="key">topic_id</span>: <span class="str">"${esc(state.topicId)}"</span>` : '<span class="comment">// no topic_id — will skip entity lookups</span>'}
<span class="key">research_mode</span>: <span class="str">"${state.researchMode}"</span>
<span class="key">style</span>: <span class="str">"${state.storyStyle}"</span>
<span class="key">tone</span>: <span class="str">"${state.storyTone}"</span>
<span class="key">length</span>: <span class="str">"${state.storyLength}"</span>
<span class="key">max_videos</span>: <span class="num">${state.maxVideos}</span>
<span class="key">enable_interview_lookup</span>: <span class="bool">${state.enableInterviews}</span>
<span class="key">enable_entity_enrichment</span>: <span class="bool">${state.enableEnrichment}</span>
<span class="key">enable_twitter_sentiment</span>: <span class="bool">${state.enableTwitter}</span>
<span class="key">enable_document_search</span>: <span class="bool">${state.enableDocSearch}</span>
<span class="key">generate_package</span>: <span class="bool">${state.enablePackage}</span>${state.enableAudio ? `\n<span class="key">generate_audio</span>: <span class="bool">true</span>` : ''}</div>
      </div>
      <div class="detail-section">
        <div class="data-flow">
          <span class="data-tag input">HTTP POST</span>
          <span class="arrow">→</span>
          <span class="data-tag output">runStoryPipeline(config)</span>
        </div>
      </div>`
    },
    {
      num: 1,
      type: 'research',
      title: 'Query Interpretation',
      subtitle: 'LLM expands your query into a search plan',
      file: 'src/lib/research-workflow.ts → interpretQuery()',

// ---- RENDER ----
function renderPipeline() {
  const steps = getSteps();
  const pipeline = document.getElementById('pipeline');

  pipeline.innerHTML = steps.map((step, idx) => {
    const isExpanded = state.expandedSteps.has(idx);
    const disabledClass = step.enabled ? '' : ' disabled';

    return `
      <div class="step step-type-${step.type}${disabledClass}" data-idx="${idx}">
        ${idx < steps.length - 1 ? '<div class="step-connector"></div>' : ''}
        <div class="step-header" onclick="toggleStep(${idx})">
          <div class="step-number">${step.num}</div>
          <div class="step-info">
            <div class="step-title">${step.title}</div>
            <div class="step-subtitle">${step.subtitle}</div>
            <div class="step-file">${step.file}</div>
          </div>
          <span class="step-badge" style="color: ${step.badge.color}; border: 1px solid ${step.badge.color}40; background: ${step.badge.color}15;">${step.badge.text}</span>
        </div>
        <div class="step-detail ${isExpanded && step.enabled ? '' : 'collapsed'}" style="max-height: ${isExpanded && step.enabled ? '800px' : '0'};">
          <div class="detail-card">${step.enabled ? step.detail() : '<div style="color: var(--muted); font-size: 0.8rem;">This step is disabled with current settings.</div>'}</div>
        </div>
      </div>`;
  }).join('');
}

function toggleStep(idx) {
  if (state.expandedSteps.has(idx)) {
    state.expandedSteps.delete(idx);
  } else {
    state.expandedSteps.add(idx);
  }
  renderPipeline();
}

  const config = {

    length: state.storyLength,
    max_videos: state.maxVideos,
    enable_interview_lookup: state.enableInterviews,
    enable_entity_enrichment: state.enableEnrichment,
    enable_twitter_sentiment: state.enableTwitter,
    enable_document_search: state.enableDocSearch,
    generate_package: state.enablePackage,
    ...(state.enableAudio && { generate_audio: true, dia_seed: state.diaSeed })
  };

  const curlCmd = `curl -X POST http://localhost:3000/api/stories/pipeline \\
  -H "Content-Type: application/json" \\
  -d '${JSON.stringify(config, null, 2)}'`;

  out.textContent = curlCmd;
}

function copyPrompt() {
  const text = document.getElementById('promptOutput').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

// ---- HELPERS ----
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function extractEntitiesFromQuery(query) {
  // Simple heuristic: extract capitalized words/names, common entity patterns
  const entities = [];
  const vsMatch = query.match(/(\w[\w\s]*?)\s+vs\.?\s+(\w[\w\s]*?)(?:\s|$)/i);
  if (vsMatch) {
    entities.push(vsMatch[1].trim(), vsMatch[2].trim());
  }
  // Also look for quoted or capitalized multi-word names
  const namePattern = /\b([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)\b/g;
  let match;
  while ((match = namePattern.exec(query)) !== null) {
    const name = match[1];
    if (!entities.includes(name) && name.length > 2 && !['The', 'And', 'For', 'With', 'From', 'About'].includes(name)) {
      entities.push(name);
    }
  }
  // Fallback: if we found nothing, split on common delimiters
  if (entities.length === 0) {
    const words = query.split(/\s+/).filter(w => w.length > 3);
    entities.push(words[0] || 'topic');
  }
  return entities.slice(0, 4);
}

// ---- MAIN UPDATE ----
function updateAll() {
  readState();
  renderPipeline();
  updatePrompt();
}

// ---- INIT ----
updateAll();
