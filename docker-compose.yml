# Talk Show Go - Docker Services
# Core services: PostgreSQL, Redis, SearXNG, Dia TTS, Worker

services:
  # ============================================
  # DATABASE LAYER
  # ============================================

  postgres:
    image: pgvector/pgvector:0.8.0-pg15
    container_name: tsg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talkshowgo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talkshowgo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tsg-network

  # ============================================
  # REST API (Supabase-compatible)
  # ============================================

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: tsg-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/talkshowgo
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    ports:
      - "8000:3000"
    networks:
      - tsg-network

  # ============================================
  # JOB QUEUE
  # ============================================

  redis:
    image: redis:7-alpine
    container_name: tsg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tsg-network

